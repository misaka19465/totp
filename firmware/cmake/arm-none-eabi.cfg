# 交叉编译设置：使用 arm-none-eabi-* 而非宿主工具链。
# NOTE: 本文件供 `cmake -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cfg` 使用，
#       以适配需要显式工具链文件的场景（CI、IDE）。
set(CMAKE_SYSTEM_NAME Generic)
set(CMAKE_SYSTEM_PROCESSOR arm)
set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

find_program(ARM_GCC arm-none-eabi-gcc REQUIRED)
get_filename_component(ARM_BIN ${ARM_GCC} DIRECTORY)

set(CMAKE_C_COMPILER   ${ARM_BIN}/arm-none-eabi-gcc)
set(CMAKE_ASM_COMPILER ${ARM_BIN}/arm-none-eabi-gcc)
set(CMAKE_AR           ${ARM_BIN}/arm-none-eabi-ar)
set(CMAKE_OBJCOPY      ${ARM_BIN}/arm-none-eabi-objcopy)
set(CMAKE_OBJDUMP      ${ARM_BIN}/arm-none-eabi-objdump)
set(CMAKE_SIZE         ${ARM_BIN}/arm-none-eabi-size)
set(CMAKE_RANLIB       ${ARM_BIN}/arm-none-eabi-ranlib)

set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
